[project]
name = "craft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gaga999", email = "jjjj4444.h@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flax>=0.12.12",
    "jax>=0.12.0.1",
    "numpy>=2.5.4",
    "omegaconf>=2.4.0",
    "optax>=0.2.8",
    "wandb>=0.31.0",
]

[project.scripts]
craft = "craft:main"

[project.optional-dependencies]
cuda = [
    "jax[cuda13]>=0.12.0.1 ; (platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'x86_64' and sys_platform == 'linux')",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
