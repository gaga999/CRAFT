seed: 0
output_dir: runs/anchor_1e-2
agent:
  chunk_length: 5
  width: 128
  depth: 4
  exchange_every: 2
  latent_dim: 128
  vae_latent_dim: 16
  fusion_depth: 2
  prior_learning_rate: 0.0001
  kl_weight: 0.01
  guide_weight: 0.1
  anchor_weight: 0.01
  guidance_enabled: true
  cvae_updates_crl: false
  condition_drop_prob: 0.2
  log_std_min: -4.0
  log_std_max: 1.0
  learning_rate: 0.0003
  max_grad_norm: 10.0
data:
  name: cube-single-noisy-v0
  directory: data/ogbench
  path: null
  synthetic: false
  batch_size: 256
  discount: 0.95
  workers: 2
  prefetch_batches: 4
  device_prefetch: 2
train:
  stages:
    - name: joint
      steps: 300000
  log_interval: 100
  eval_interval: 150000
  save_interval: 50000
evaluation:
  episodes: 10
  execution_length: 1
logging:
  backend: console
  project: craft
