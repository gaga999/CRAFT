# Puzzle task: combinatorial button presses with the same arm (action dim 5).
seed: 0
output_dir: runs/puzzle_3x3_noisy
agent:
  chunk_length: 5
  width: 128
  depth: 4
  exchange_every: 2
  embedding_dim: 128
  latent_dim: 8
  decoder_depth: 2
  actor_width: 256
  actor_depth: 3
  reconstruction_weight: 1.0
  bc_weight: 1.0
  latent_noise: 0.2
  guidance: reencoded
  max_scale: 30.0
  learning_rate: 0.0003
  actor_learning_rate: 0.0003
  weight_decay: 0.01
  actor_weight_decay: 0.0
  max_grad_norm: 10.0
data:
  name: puzzle-3x3-noisy-v0
  directory: data/ogbench
  path: null
  synthetic: false
  batch_size: 1024
  discount: 0.95
  workers: 2
  prefetch_batches: 4
  device_prefetch: 2
train:
  stages:
    - name: joint
      steps: 1000000
  log_interval: 1000
  eval_interval: 50000
  save_interval: 50000
evaluation:
  episodes: 10
  execution_length: 1
init:
  checkpoint: null
  modules: [representation, actor]
logging:
  backend: wandb
  project: craft
