# CPU-sized candidate, not paper-equivalent capacity or a tuned learning result.
# FQL weight 0.1 and discount 0.95 follow the reference get_config defaults.
seed: 0
output_dir: runs/cpu_puzzle
agent:
  chunk_length: 3
  width: 128
  depth: 4
  exchange_every: 2
  latent_dim: 128
  learning_rate: 0.0003
  flow_steps: 10
  max_grad_norm: 10.0
  distillation_weight: 0.1
data:
  name: puzzle-3x3-noisy-v0
  directory: data/ogbench
  path: null
  synthetic: false
  batch_size: 256
  discount: 0.95
train:
  stages:
    - name: joint
      steps: 1000000
  log_interval: 100
  eval_interval: 5000
  save_interval: 5000
evaluation:
  episodes: 2
  execution_length: 1
logging:
  backend: wandb
  project: craft
