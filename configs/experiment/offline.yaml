seed: 0
output_dir: runs/crl_tokens
agent:
  chunk_length: 5
  width: 128
  depth: 4
  exchange_every: 2
  latent_dim: 128
  vae_latent_dim: 16
  fusion_depth: 2
  prior_learning_rate: 0.0001
  kl_weight: 0.01
  guide_weight: 0.1
  guidance_enabled: true
  cvae_updates_crl: false
  condition_drop_prob: 0.2
  log_std_min: -4.0
  log_std_max: 1.0
  learning_rate: 0.0003
  max_grad_norm: 10.0
data:
  name: pointmaze-medium-navigate-v0
  directory: data/ogbench
  path: null
  synthetic: false
  batch_size: 256
  discount: 0.95
train:
  stages:
    - name: joint
      steps: 1000000
  log_interval: 1000
  eval_interval: 50000
  save_interval: 50000
evaluation:
  episodes: 20
  execution_length: 1
logging:
  backend: console
  project: craft
