seed: 0
output_dir: runs/crl_tokens
agent:
  chunk_length: 4
  width: 128
  depth: 4
  exchange_every: 2
  latent_dim: 128
  learning_rate: 0.0003
  flow_steps: 10
  max_grad_norm: 10.0
  distillation_weight: 0.1
data:
  name: pointmaze-medium-navigate-v0
  directory: data/ogbench
  path: null
  synthetic: false
  batch_size: 256
  discount: 0.95
train:
  stages:
    - name: joint
      steps: 1000000
  log_interval: 1000
  eval_interval: 50000
  save_interval: 50000
evaluation:
  episodes: 20
  execution_length: 1
logging:
  backend: console
  project: craft
