# Plumbing check on synthetic data: not a learning experiment.
seed: 0
output_dir: runs/smoke
agent:
  chunk_length: 5
  # Representation capacity, per component.
  action_encoder_width: 16
  action_encoder_depth: 2
  exchange_every: 2
  latent_dim: 4
  state_encoder_width: 16
  state_encoder_depth: 1
  goal_encoder_width: 16
  goal_encoder_depth: 2
  head_width: 16
  head_depth: 1
  embedding_dim: 8
  decoder_width: 16
  decoder_depth: 1
  # Critic score: cosine (t * cos + b, t <= max_scale) or dot (phi.psi / sqrt(D) + b).
  similarity: cosine
  max_scale: 30.0
  # Actor. actor_inputs: subset of [goal_embedding, state_embedding].
  actor_width: 32
  actor_depth: 2
  actor_inputs: []
  guidance: reencoded
  bc_weight: 1.0
  # bc_weighting: none | advantage (exp(beta * A) clipped; baseline actor | batch).
  bc_weighting: none
  advantage_beta: 1.0
  advantage_max_weight: 100.0
  advantage_baseline: actor
  reconstruction_weight: 1.0
  latent_noise: 0.2
  learning_rate: 0.0003
  actor_learning_rate: 0.0003
  weight_decay: 0.01
  actor_weight_decay: 0.0
  max_grad_norm: 10.0
data:
  synthetic: true
  batch_size: 4
  discount: 0.95
  workers: 0
  prefetch_batches: 4
  device_prefetch: 2
train:
  # Every stage once: representation pretraining, actor-only, then joint.
  stages:
    - name: representation
      steps: 1
    - name: actor
      steps: 1
    - name: joint
      steps: 1
  log_interval: 1
  eval_interval: 100
  save_interval: 3
evaluation:
  episodes: 1
  execution_length: 1
init:
  checkpoint: null
  modules: [representation, actor]
logging:
  backend: console
  project: craft
  name: null
