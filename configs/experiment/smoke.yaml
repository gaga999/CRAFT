seed: 0
output_dir: runs/smoke
agent:
  chunk_length: 5
  width: 16
  depth: 2
  exchange_every: 2
  latent_dim: 8
  vae_latent_dim: 3
  fusion_depth: 2
  prior_learning_rate: 0.0001
  kl_weight: 0.01
  guide_weight: 0.1
  guidance_enabled: true
  guide_through_std: false
  cvae_updates_crl: false
  cvae_representation: critic
  condition_drop_prob: 0.2
  log_std_min: -4.0
  log_std_max: 1.0
  learning_rate: 0.0003
  max_grad_norm: 10.0
data:
  synthetic: true
  batch_size: 4
  discount: 0.95
  workers: 0
  prefetch_batches: 4
  device_prefetch: 2
train:
  stages:
    - name: joint
      steps: 3
  log_interval: 1
  eval_interval: 100
  save_interval: 3
evaluation:
  episodes: 1
  execution_length: 1
logging:
  backend: console
  project: craft
