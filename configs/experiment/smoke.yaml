# Plumbing check on synthetic data: not a learning experiment.
seed: 0
output_dir: runs/smoke
agent:
  chunk_length: 5
  width: 16
  depth: 2
  exchange_every: 2
  embedding_dim: 8
  latent_dim: 4
  decoder_depth: 1
  actor_width: 32
  actor_depth: 2
  reconstruction_weight: 1.0
  bc_weight: 1.0
  latent_noise: 0.2
  guidance: reencoded
  max_scale: 30.0
  learning_rate: 0.0003
  actor_learning_rate: 0.0003
  weight_decay: 0.01
  actor_weight_decay: 0.0
  max_grad_norm: 10.0
data:
  synthetic: true
  batch_size: 4
  discount: 0.95
  workers: 0
  prefetch_batches: 4
  device_prefetch: 2
train:
  # Every stage once: representation pretraining, actor-only, then joint.
  stages:
    - name: representation
      steps: 1
    - name: actor
      steps: 1
    - name: joint
      steps: 1
  log_interval: 1
  eval_interval: 100
  save_interval: 3
evaluation:
  episodes: 1
  execution_length: 1
init:
  checkpoint: null
  modules: [representation, actor]
logging:
  backend: console
  project: craft
