seed: 0
output_dir: runs/smoke
agent:
  chunk_length: 2
  width: 16
  depth: 2
  exchange_every: 2
  latent_dim: 8
  learning_rate: 0.0003
  flow_steps: 2
  alpha: 10.0
data:
  synthetic: true
  batch_size: 4
  discount: 0.99
train:
  stages:
    - name: joint
      steps: 3
  log_interval: 1
  eval_interval: 100
  save_interval: 3
evaluation:
  episodes: 1
  execution_length: 1
logging:
  backend: console
  project: craft
